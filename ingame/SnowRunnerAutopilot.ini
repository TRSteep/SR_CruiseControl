; Native ASI mod. Restart the game after changing ToggleKey.
[Autopilot]
; Windows virtual key: F6=117, F7=118. Supported F2-F12 except F4.
ToggleKey=117

[HUD]
; Anchored to the native parking-brake row; hidden when driving HUD is absent.
; Optional offsets in reference pixels at 1920x1080.
; In game: Ctrl+Alt+arrows move, Ctrl+Alt+PgUp/PgDn scale, Ctrl+Alt+H hide.
OffsetX=0
OffsetY=0
ScalePercent=110
Visible=1
; Fixed calibrated position and tilt. Set 1 to opt into measured HUD motion.
FollowNativeMotion=0
; Optional extra tilt in degrees, -15..15.
TiltOffsetDegrees=0
